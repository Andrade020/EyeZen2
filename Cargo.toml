[package]
name = "eyezen"
version = "2.1.0"
edition = "2021"

[[bin]]
name = "EyeZen"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
tray-icon = "0.18"
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["wingdi", "winuser", "libloaderapi", "processthreadsapi", "winnt", "winbase", "handleapi"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
